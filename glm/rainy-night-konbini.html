<script type="module">
window.addEventListener('error', e => { try { document.body.dataset.err = String(e.message || e.error); } catch(_){} });

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const root = document.getElementById('konbini-rainy-root');
const stage = root.querySelector('.stage');

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
scene.fog = new THREE.Fog(0x0a0e1a, 38, 95);

const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 220);
camera.position.set(30, 21, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.9;
controls.minDistance = 7;
controls.maxDistance = 46;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.52;

function resize(){
  const w = stage.clientWidth || root.clientWidth || window.innerWidth || 1280;
  const h = stage.clientHeight || 680;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- environment reflections ---------- */
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#05070f'); gr.addColorStop(.55, '#0d1526'); gr.addColorStop(.72, '#1c2740'); gr.addColorStop(.78, '#4a3a30'); gr.addColorStop(.84, '#141b2c'); gr.addColorStop(1, '#05070d');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 256);
  g.fillStyle = 'rgba(64,224,150,.5)'; g.fillRect(40, 168, 70, 26);
  g.fillStyle = 'rgba(255,140,90,.45)'; g.fillRect(300, 170, 90, 24);
  g.fillStyle = 'rgba(255,110,170,.4)'; g.fillRect(420, 172, 60, 20);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.06).texture;
  pm.dispose();
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x42537e, 0x151a28, 0.8));
const moon = new THREE.DirectionalLight(0xa4bcff, 1.05);
moon.position.set(-10, 17, -8);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -16; moon.shadow.camera.right = 16;
moon.shadow.camera.top = 16; moon.shadow.camera.bottom = -16;
moon.shadow.camera.near = 4; moon.shadow.camera.far = 48;
moon.shadow.bias = -0.0004; moon.shadow.normalBias = 0.03;
scene.add(moon);
const rim = new THREE.DirectionalLight(0x54689e, 0.4);
rim.position.set(9, 8, 11);
scene.add(rim);

/* ---------- materials & helpers ---------- */
const grad = new THREE.DataTexture(new Uint8Array([105, 175, 222, 255]), 4, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;

const matCache = new Map();
function toon(color, opt = {}){
  const key = 't' + color + JSON.stringify(opt);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: grad, ...opt });
  matCache.set(key, m);
  return m;
}
function std(color, opt = {}){
  const key = 's' + color + JSON.stringify(opt);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.08, ...opt });
  matCache.set(key, m);
  return m;
}

const outlineMats = new Map();
function outlineMat(w){
  if (!outlineMats.has(w)) outlineMats.set(w, new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: true,
    uniforms: { uW: { value: w } },
    vertexShader: 'uniform float uW; void main(){ vec3 p = position + normal * uW; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(0.024, 0.033, 0.066, 1.0); }'
  }));
  return outlineMats.get(w);
}
function addOutline(mesh, w = 0.022){
  mesh.add(new THREE.Mesh(mesh.geometry, outlineMat(w)));
  return mesh;
}

function makeTex(w, h, fn){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const JFONT = "'Yu Gothic','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif";

function G(parent, x = 0, y = 0, z = 0, ry = 0){
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  parent.add(g);
  return g;
}
function box(parent, w, h, d, mat, x, y, z, opt = {}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (opt.ry) m.rotation.y = opt.ry;
  if (opt.rx) m.rotation.x = opt.rx;
  if (opt.rz) m.rotation.z = opt.rz;
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  if (opt.out) addOutline(m, opt.out);
  parent.add(m);
  return m;
}
function cyl(parent, rt, rb, h, seg, mat, x, y, z, opt = {}){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  if (opt.rx) m.rotation.x = opt.rx;
  if (opt.rz) m.rotation.z = opt.rz;
  if (opt.ry) m.rotation.y = opt.ry;
  m.castShadow = opt.cast !== false;
  m.receiveShadow = opt.recv !== false;
  if (opt.out) addOutline(m, opt.out);
  parent.add(m);
  return m;
}
function plane(parent, w, h, mat, x, y, z, opt = {}){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  if (opt.ry) m.rotation.y = opt.ry;
  if (opt.rx) m.rotation.x = opt.rx;
  if (opt.rz) m.rotation.z = opt.rz;
  m.receiveShadow = !!opt.recv;
  parent.add(m);
  return m;
}

/* ---------- assembly animation registry ---------- */
const actors = [];
function act(o, opt = {}){
  actors.push({
    o, t: opt.t ?? 0, dur: opt.dur ?? 0.7,
    drop: opt.drop ?? 4, spin: opt.spin ?? 0,
    mode: opt.mode ?? 'drop',
    py: o.position.y, ry: o.rotation.y, s: o.scale.x, wire: opt.wire ?? null, done: false
  });
  o.visible = false;
}
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const bounce = t => { const n = 7.5625, d = 2.75;
  if (t < 1/d) return n*t*t;
  if (t < 2/d) return n*(t -= 1.5/d)*t + .75;
  if (t < 2.5/d) return n*(t -= 2.25/d)*t + .9375;
  return n*(t -= 2.625/d)*t + .984375; };
const dropEase = t => 0.72 * easeOutCubic(t) + 0.28 * (1 - bounce(1 - t));

/* neon / light gating */
const gated = [];
function gate(items, tOn){
  for (const it of items){
    gated.push({ ...it, tOn,
      base: it.light ? it.light.intensity : (it.mat ? (it.mat.emissiveIntensity ?? 1) : 1),
      col: it.mat && it.mat.color ? it.mat.color.clone() : null });
  }
}
function gateVal(T, t0){
  if (T < t0) return 0;
  const u = T - t0;
  if (u > 1.1) return 1 + 0.035 * Math.sin(T * 41 + t0 * 7);
  const s = Math.sin(u * 57) * Math.sin(u * 23 + 1.7) * Math.sin(u * 7);
  return s > 0.18 ? 1 : 0.06;
}

/* ---------- reflection smear helper (used by signs & props) ---------- */
const smearTex = makeTex(64, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
function smear(x, y, z, sx, sz, color){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz),
    new THREE.MeshBasicMaterial({ map: smearTex, color, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z + sz / 2 - 0.1);
  m.renderOrder = 3;
  scene.add(m);
  act(m, { t: 6.4, mode: 'flat', dur: 0.6 });
  return m;
}

    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);

{

}

/* interior */
const interiorGlowItems = [];
{

/* ============================================================
   RAIN + SPLASH
============================================================ */
const RAIN_N = 1200;
const rainPos = new Float32Array(RAIN_N * 6);
const drops = [];
for (let i = 0; i < RAIN_N; i++) drops.push({
  x: -12 + Math.random() * 24, z: -12 + Math.random() * 24,
  y: Math.random() * 14, v: 9 + Math.random() * 7, l: 0.35 + Math.random() * 0.3
});
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: 0xa9c4e8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false;
scene.add(rain);

const splashPts = [];
{
  const rects = [[-10.3, -6.7, -10.3, 4.2, 0.062], [-6.3, 10.7, 4.7, 8.3, 0.066], [-4.4, 9.8, -0.3, 2.7, 0.062]];
  for (let i = 0; i < 46; i++){
    const r = rects[i % 3];
    splashPts.push({ x: r[0] + Math.random() * (r[1] - r[0]), z: r[2] + Math.random() * (r[3] - r[2]), y: r[4], ph: Math.random(), dur: 0.55 + Math.random() * 0.35 });
  }
}
const ringGeo = new THREE.RingGeometry(0.5, 0.6, 22);
const rings = splashPts.map(p => {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x9fc0e8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(p.x, p.y, p.z);
  scene.add(m);
  return m;
});

/* ============================================================
   TIMELINE / LOOP
============================================================ */
const introFrom = new THREE.Vector3(30, 21, 30);
const introTo = new THREE.Vector3(16.4, 10.6, 17.2);
let intro = true, introT = 0;
controls.addEventListener('start', () => { intro = false; });

const clock = new THREE.Clock();
let T = 0, timeScale = 1;
window.__speed = v => { timeScale = v; };
window.__T = () => T;
window.__cam = () => camera.position.toArray().map(v => +v.toFixed(2));
window.__view = (x, y, z) => { camera.position.set(x, y, z); controls.update(); intro = false; };
const rainStart = 7.2;

function tick(forced){
  const dt = Math.min(forced ?? clock.getDelta(), 0.05 * timeScale);
  T += dt * timeScale;

  if (intro){
    introT += dt;
    const k = Math.min(1, introT / 6.5);
    camera.position.lerpVectors(introFrom, introTo, k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    if (k >= 1) intro = false;
  }
  controls.update();

  for (const a of actors){
    const k = (T - a.t) / a.dur;
    if (k <= 0){ if (a.o.visible) a.o.visible = false; continue; }
    if (!a.o.visible) a.o.visible = true;
    if (a.done) continue;
    if (k >= 1){
      a.o.position.y = a.py;
      a.o.rotation.y = a.ry;
      a.o.scale.setScalar(a.s);
      if (a.wire) a.wire.setDrawRange(0, Infinity);
      a.done = true;
      continue;
    }
    if (a.mode === 'flat'){
      a.o.scale.setScalar(a.s * Math.max(0.001, easeOutBack(k)));
    } else if (a.mode === 'wire'){
      const cnt = a.wire.index.count;
      a.wire.setDrawRange(0, Math.floor(easeOutCubic(k) * cnt / 3) * 3);
    } else {
      a.o.position.y = a.py + a.drop * (1 - dropEase(k));
      if (a.spin) a.o.rotation.y = a.ry + a.spin * (1 - easeOutCubic(k));
    }
  }

  for (const g of gated){
    const v = gateVal(T, g.tOn);
    if (g.light) g.light.intensity = g.base * v;
    else if (g.mat){
      if (g.col) g.mat.color.copy(g.col).multiplyScalar(Math.max(0.03, v));
      else g.mat.emissiveIntensity = g.base * v;
    }
  }

  rainMat.opacity = Math.max(0, Math.min(0.5, (T - rainStart) / 1.8 * 0.5));
  if (rainMat.opacity > 0){
    const pos = rainGeo.attributes.position.array;
    const wx = -1.6;
    for (let i = 0; i < RAIN_N; i++){
      const d = drops[i];
      d.y -= d.v * dt;
      d.x += wx * dt;
      if (d.y < 0.1){ d.y = 12 + Math.random() * 3; d.x = -12 + Math.random() * 24; d.z = -12 + Math.random() * 24; }
      const inStore = (d.x > -3.4 && d.x < 6.4 && d.z > -8.4 && d.z < -1.6) || (d.x > 8.3 && d.x < 10.9 && d.z > -9.9 && d.z < -1.6);
      const j = i * 6;
      if (inStore){
        pos[j] = pos[j + 3] = d.x; pos[j + 1] = pos[j + 4] = d.y; pos[j + 2] = pos[j + 5] = d.z;
      } else {
        pos[j] = d.x; pos[j + 1] = d.y; pos[j + 2] = d.z;
        pos[j + 3] = d.x + wx * 0.045; pos[j + 4] = d.y + d.l; pos[j + 5] = d.z;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  if (T > rainStart + 0.5){
    const fade = Math.min(1, T - rainStart - 0.5);
    for (let i = 0; i < rings.length; i++){
      const p = splashPts[i];
      const u = ((T - rainStart) / p.dur + p.ph) % 1;
      rings[i].scale.setScalar(0.08 + u * 0.5);
      rings[i].material.opacity = 0.34 * (1 - u) * fade;
    }
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(() => tick());
window.__step = (s, n = 1) => { for (let i = 0; i < n; i++) tick(s); };
window.__shot = () => {
  renderer.render(scene, camera);
  const c = document.createElement('canvas');
  c.width = Math.round(renderer.domElement.width * 0.55);
  c.height = Math.round(renderer.domElement.height * 0.55);
  c.getContext('2d').drawImage(renderer.domElement, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72).split(',')[1];
};
